x-common-volumes: &common-volumes
  - homedir:/home/ubuntu
  - ..:/home/ubuntu/app


x-common-build: &common-build
  context: '.'
  dockerfile: 'Dockerfile.chemotion-dev'
  target: chemotion_dev_base
  args:
    uid: skip
    gid: skip


services:
  setup:
    build: *common-build
    volumes: *common-volumes


  app:
    build: *common-build
    volumes: *common-volumes

  webpacker:
    volumes: *common-volumes

  # docker-compose.dev.yml is copied into .devcontainer/, so ./mof_service would
  # resolve to .devcontainer/mof_service; point at the repo root instead.
  mof_service:
    build:
      context: ../mof_service
