# Rails 7.2 removed Rails.application.secrets — this file is NOT read by the
# framework anymore. It exists only because the ptrxyz/chemotion image build
# chain (embed/secret.sh) reads it via erb+yq; without it `make all-eln`
# aborts and the container half-boots WITHOUT running migrations while the
# app still starts (SECRET_KEY_BASE via ENV). Remove once secret.sh
# tolerates the file's absence.
production:
  secret_key_base: <%= ENV["SECRET_KEY_BASE"] %>
